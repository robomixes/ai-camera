version: "3.8"

services:
  ai-camera:
    build: .
    container_name: ai-camera
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Persist data across container restarts
      - ./data/event_images:/app/event_images
      - ./data/roi_events:/app/roi_events
      - ./data/logs:/app/logs
      - ./data/people_search_queue:/app/people_search_queue
      - ./detections_history.db:/app/detections_history.db
      - ./config_overrides.json:/app/config_overrides.json
      - ./auth.json:/app/auth.json
    environment:
      - TF_ENABLE_ONEDNN_OPTS=0
      - OPENCV_FFMPEG_LOGLEVEL=quiet
    # For GPU access (if available):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]
