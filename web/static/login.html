<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privora AI Camera - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #16213e;
            border: 1px solid #1e2d4a;
            border-radius: 12px;
            padding: 40px;
            width: 360px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .login-title {
            text-align: center;
            margin-bottom: 8px;
            font-size: 1.4rem;
            color: #00d4ff;
            font-weight: 700;
        }

        .login-subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 0.85rem;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: #6b7280;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            background: #0f0f1a;
            border: 1px solid #1e2d4a;
            color: #e0e0e0;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00d4ff;
        }

        .btn-login {
            width: 100%;
            background: #00d4ff;
            color: #1a1a2e;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 8px;
        }

        .btn-login:hover { opacity: 0.85; }
        .btn-login:disabled { opacity: 0.5; cursor: default; }

        .login-error {
            color: #ff5252;
            font-size: 0.8rem;
            text-align: center;
            margin-top: 12px;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1 class="login-title">Privora AI Camera</h1>
        <p class="login-subtitle">Sign in to access the dashboard</p>

        <form id="login-form" onsubmit="doLogin(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-login" id="btn-login">Sign In</button>
            <div id="login-error" class="login-error"></div>
        </form>
    </div>

    <script>
        async function doLogin(event) {
            event.preventDefault();
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const errorEl = document.getElementById("login-error");
            const btn = document.getElementById("btn-login");

            errorEl.textContent = "";
            btn.disabled = true;
            btn.textContent = "Signing in...";

            try {
                const resp = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                if (resp.ok) {
                    window.location.href = "/";
                } else {
                    const data = await resp.json();
                    errorEl.textContent = data.error || "Login failed";
                }
            } catch (e) {
                errorEl.textContent = "Connection error";
            } finally {
                btn.disabled = false;
                btn.textContent = "Sign In";
            }
        }
    </script>
</body>
</html>
